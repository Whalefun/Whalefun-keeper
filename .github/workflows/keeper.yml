name: dividend-keeper

# Drives Whale.fun dividends on a schedule: for each v2 token it pushes accrued
# dividends (distributeTo) and triggers each dividend vault's snowball + cold-start sync.
# Everything it calls is PERMISSIONLESS — the hot wallet only pays gas and holds no privileges.
#
# One-time setup:
#   1) Generate a FRESH wallet (NOT the owner/deployer/guardian key). Fund it with a little BNB for gas.
#   2) Repo Settings → Secrets and variables → Actions → New repository secret:
#        name  = KEEPER_PK      value = that fresh wallet's private key (0x...)
#   3) (optional) Repo Variables to override the defaults below: RPC_URL, LAUNCH_FACTORY_V2
#   4) Push this repo. It then runs on the schedule below; you can also run it manually
#      from the Actions tab (Run workflow).
#
# Tip: use a PUBLIC repo so GitHub Actions minutes are free/unlimited (private repos cap at 2000 min/mo).

on:
  schedule:
    - cron: "*/15 * * * *"   # every ~15 min (GitHub schedules are best-effort / may be delayed)
  workflow_dispatch: {}        # allow manual runs from the Actions tab

concurrency:
  group: dividend-keeper
  cancel-in-progress: false    # never run two keeper rounds at once (avoids nonce clashes)

jobs:
  run:
    runs-on: ubuntu-latest
    # 脚本自带 12 分钟时间预算会主动收尾并 exit 0;这里 15 分钟硬上限只做余量(含 npm install)。
    # 正常永远到不了上限;真触顶也只是这一轮提前结束、下一轮继续,不影响数据。
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Run keeper (one round)
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}
          # 主 RPC:keeper 每轮对几十个币做几百次读写都走它,必须用「快的公共节点」。
          # ⚠️ 千万别把它设成 Alchemy 之类限速端点 —— 高频调用会被限流,整轮从 30s 飙到 12min+ 甚至撞 15min 超时被杀。
          RPC_URL: ${{ vars.RPC_URL || 'https://bsc-dataseed.bnbchain.org' }}
          # 专用 getLogs 端点(可选,与主 RPC 隔离):只给「持有 LP 分红」金库自动登记扫 LP Transfer 用。
          # 要用 getLogs 方案才设成支持 getLogs 的 Alchemy BSC;含 API key,放 Secret(secrets.LOGS_RPC_URL)别放公开 Variable。
          LOGS_RPC_URL: ${{ secrets.LOGS_RPC_URL || vars.LOGS_RPC_URL || '' }}
          # 自动登记备用源(推荐,二选一优先这个):Etherscan V2 API key(免费档够用)。
          # LOGS_RPC_URL 未设而这个设了 → 每轮对每个 LP 金库调一次 Etherscan 拉最近 200 条 LP Transfer
          # 当登记候选(免 getLogs 墙,还能自愈更早漏网的持有人)。两个都没设才跳过自动登记。
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY || '' }}
          # 自动登记的扫块窗口(默认 5000 块≈1小时,增量足够)。首次启用自动登记时:临时把 repo Variable
          # LPHOLDER_SCAN_BLOCKS 设大(如 2000000 ≈ 17 天)→ Actions 手动跑一轮回补老 LP 持有人 → 跑完删除该
          # Variable 恢复默认,避免每轮都全量扫。
          LPHOLDER_SCAN_BLOCKS: ${{ vars.LPHOLDER_SCAN_BLOCKS || '5000' }}
          # 单次 getLogs 的块范围(须 ≤ 端点允许上限;Alchemy 各套餐不同,用 test-getlogs.mjs 实测后设)。
          LOG_CHUNK: ${{ vars.LOG_CHUNK || '2000' }}
          # Mainnet LaunchFactoryV2 — comma-separated list. Scans ALL so every factory's vaults keep
          # getting served: v2.2 (0x1230) + two legacy + v2.4 (0xB5AF = USDT + 持有 LP 分红 金库).
          # Override via repo variable ONLY IF you include EVERY address below (a variable replaces this default).
          LAUNCH_FACTORY_V2: ${{ vars.LAUNCH_FACTORY_V2 || '0x1230B67525247DA20e56E9f8CAaA263ae670401a,0xaDeb3eaEbA2fE20Afdb20529382e4395FaA2821c,0x2196D9B1Ee3411a4C6E26a417861713151EcdC07,0xB5AF6387ed653F3f15C01Da4031571Fd454DF22f' }}
          # Dead-token filter: skip launches whose pool WBNB < this many BNB (default 2). Set repo var to tune.
          MIN_POOL_BNB: ${{ vars.MIN_POOL_BNB || '2' }}
          # Manual skip list: comma-separated token addresses to always ignore. Set repo var SKIP_TOKENS.
          SKIP_TOKENS: ${{ vars.SKIP_TOKENS }}
        run: |
          if [ -z "$KEEPER_PK" ]; then
            echo "::warning::KEEPER_PK secret not set — skipping. Add it in repo Settings → Secrets to enable the keeper."
            exit 0
          fi
          node dividend-keeper.mjs
