name: vault-buy-keeper

# 替"延后买入"的金库(储备托底 / LP 质押分红的新实现)触发买入;顺带给燃烧池金库 poke(到点帮烧 / 定时器停摆时
# 重新预约 / 金库价落后现价 ≥1% 且满 10 分钟时刷新,先模拟、确实有用才发)。每轮几秒到一分钟。
# 调用的全是 permissionless 函数(buyPendingReserve / sync / poke),热钱包只付 gas、没有任何权限。
#
# 触发方式:只有 workflow_dispatch —— 由 cron-job.org 每 5 分钟打一次 dispatch 接口,不用 GitHub 自带定时器。
#   POST https://api.github.com/repos/<owner>/<repo>/actions/workflows/vault-buy-keeper.yml/dispatches
#   请求体 {"ref":"main"},请求头 Authorization: Bearer <细粒度 PAT,仅本仓库 Actions 读写>、
#   Accept: application/vnd.github+json、Content-Type: application/json;测试运行返回 204 才算对。
#
# 热钱包:和 dividend-keeper 用【同一个】(Secret KEEPER_PK,地址 0x79C81a76e8287e5Cf9f362d9E79b08D6112302A3),不用另建。
# 同一个钱包被两个任务同时用会撞 nonce(两边拿到同一个 nonce,后发的那笔失败),所以这里和 keeper.yml 放在
# 【同一个并发组】里:同一时刻只有一个任务在发交易,另一个排队。见下面 concurrency 的说明。
#
# 工厂地址已内置(BSC 主网审计版 mint 工厂 0xf21340c8…、曲线工厂 0x27Bdd246…,2026-10-10 部署)。
# 燃烧池金库工厂:老工厂 0x6F2C9bc9…(绑旧 mint 工厂 0xB5AF…)、审计版 0x9BFDfbB9…(绑 0xf21340c8…),脚本从工厂绑定的
# mint 工厂里自己找出燃烧池金库,新发的币不用改配置。
# 以后换工厂:改下面的默认值,或设 Repo Variables VAULT_BUY_MINT_FACTORIES / VAULT_BUY_CURVE_FACTORIES /
# VAULT_BUY_BURN_POOL_FACTORIES(逗号分隔,会整个覆盖默认值)。

on:
  workflow_dispatch: {}

# 组名必须和 keeper.yml 的一模一样(GitHub 的并发组是整个仓库共用的,跨 workflow 生效)。
# cancel-in-progress 必须是 false:设成 true 的话,这个 5 分钟一次的任务会把正在跑的分红 keeper 拦腰砍掉
# (交易发到一半)。排队规则:组里同时最多一个在跑、一个在等;新来的会顶掉【在等的】那个,不会动在跑的。
#   · 分红 keeper 在跑(通常 30 秒,最坏 12 分钟)→ 本任务排队,跑完马上接上;期间多次触发只留最新一个。
#   · 本任务在跑(约半分钟)时分红 keeper 被触发 → 它排队,本任务结束就跑。
# 卡死自愈靠超时:本任务 3 分钟、分红 keeper 15 分钟,到点自动结束放行下一个。
concurrency:
  group: dividend-keeper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      # 和 keeper.yml 一样:不开 npm 缓存、用 npm install。这个仓库的 package-lock.json 在 .gitignore 里,
      # GitHub 上没有锁文件 —— setup-node 的 cache: npm 和 npm ci 都要求有锁文件,没有就直接失败。
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Run vault buy keeper (one round)
        env:
          KEEPER_PK: ${{ secrets.KEEPER_PK }}
          # 可多个(逗号分隔);脚本开跑前逐个探测"肯不肯收交易",挑第一个能用的。不设则用脚本内置的候选列表。
          RPC_URL: ${{ vars.VAULT_BUY_RPC_URL }}
          LAUNCH_FACTORY_V2: ${{ vars.VAULT_BUY_MINT_FACTORIES || '0xf21340c8B8227D2Fc20e385dB9D058F8ce13eE7b' }}
          CURVE_FACTORIES: ${{ vars.VAULT_BUY_CURVE_FACTORIES || '0x27Bdd246E1dbbA83C6b926BB261F2478f3CDa564' }}
          BURN_POOL_FACTORIES: ${{ vars.VAULT_BUY_BURN_POOL_FACTORIES || '0x6F2C9bc9f8D802bA642efD9406Cc9A5636A07742,0x9BFDfbB942CcC1492B97b81DE6ABaFd9E6373D48' }}
          MIN_PENDING_WEI: ${{ vars.VAULT_BUY_MIN_PENDING_WEI }}
          # 燃烧池金库价和现价差到多少(基点)才刷新,不设 = 100(1%)
          BURN_POOL_PRICE_LAG_BPS: ${{ vars.VAULT_BUY_BURN_POOL_PRICE_LAG_BPS }}
          # 不管差多少,金库价最多隔多少秒刷新一次,不设 = 3600(1 小时)
          BURN_POOL_REF_MAX_AGE_SEC: ${{ vars.VAULT_BUY_BURN_POOL_REF_MAX_AGE_SEC }}
        run: |
          if [ -z "$KEEPER_PK" ]; then
            echo "::warning::KEEPER_PK secret not set — skipping."
            exit 0
          fi
          if [ -z "$LAUNCH_FACTORY_V2$CURVE_FACTORIES$BURN_POOL_FACTORIES" ]; then
            echo "::warning::no factories configured (VAULT_BUY_MINT_FACTORIES / VAULT_BUY_CURVE_FACTORIES / VAULT_BUY_BURN_POOL_FACTORIES) — skipping."
            exit 0
          fi
          node vault-buy-keeper.mjs
